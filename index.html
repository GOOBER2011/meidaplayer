<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeYou</title>
  
  <style>
    /* --- CSS VARIABLES (Black & Blue Theme) --- */
    :root {
      --bg-base: #000000;
      --bg-surface: rgba(10, 15, 25, 0.7); /* Semi-transparent for aurora to show through */
      --bg-elevated: #0a1122;
      --bg-hover: #112244;
      --text-primary: #ffffff;
      --text-secondary: #8899bb;
      --accent-blue: #0066ff;
      --accent-blue-hover: #3388ff;
      --border-color: #1a2a4a;
      --error-red: #ff3333;
    }

    /* --- AURORA BACKGROUND ANIMATION --- */
    @keyframes auroraMove {
      0% { transform: translate(-10%, -10%) scale(1); }
      50% { transform: translate(10%, 10%) scale(1.2); }
      100% { transform: translate(-10%, -10%) scale(1); }
    }

    .aurora-bg {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      z-index: -1;
      background-color: #000000;
      overflow: hidden;
    }

    .aurora-blob {
      position: absolute;
      width: 60vw;
      height: 60vw;
      background: radial-gradient(circle, rgba(0, 102, 255, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
      border-radius: 50%;
      filter: blur(60px);
      animation: auroraMove 15s infinite alternate ease-in-out;
    }

    .aurora-blob:nth-child(2) {
      top: 20%; left: 50%;
      width: 50vw; height: 50vw;
      background: radial-gradient(circle, rgba(0, 51, 153, 0.2) 0%, rgba(0, 0, 0, 0) 70%);
      animation-duration: 20s;
      animation-direction: alternate-reverse;
    }

    .aurora-blob:nth-child(3) {
      top: 60%; left: 10%;
      width: 70vw; height: 70vw;
      background: radial-gradient(circle, rgba(0, 170, 255, 0.1) 0%, rgba(0, 0, 0, 0) 70%);
      animation-duration: 25s;
      animation-delay: -5s;
    }

    /* --- RESET & GLOBAL --- */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-base); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }
    
    /* SVG Icon Styling */
    svg { fill: currentColor; display: block; }

    /* --- SIDEBAR --- */
    .sidebar {
      width: 250px;
      background-color: var(--bg-surface);
      backdrop-filter: blur(10px);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      z-index: 10;
    }

    .sidebar-header {
      display: flex;
      align-items: center;
      padding: 1.5rem;
      font-size: 1.4rem;
      font-weight: 800;
      letter-spacing: -0.5px;
      border-bottom: 1px solid var(--border-color);
      color: var(--text-primary);
    }

    .logo-icon {
      color: var(--accent-blue);
      margin-right: 10px;
      width: 28px;
      height: 28px;
    }

    .nav-item {
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      gap: 1.2rem;
      cursor: pointer;
      color: var(--text-secondary);
      transition: all 0.2s ease;
      font-size: 1rem;
      font-weight: 600;
      border-left: 3px solid transparent;
    }

    .nav-item svg { width: 22px; height: 22px; }

    .nav-item:hover {
      background-color: var(--bg-hover);
      color: var(--text-primary);
    }

    .nav-item.active {
      background-color: var(--bg-elevated);
      color: var(--accent-blue);
      border-left: 3px solid var(--accent-blue);
    }

    /* --- MAIN CONTENT AREA --- */
    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      padding: 2rem 3rem;
    }

    .section-title {
      font-size: 1.3rem;
      margin-bottom: 1.2rem;
      font-weight: 700;
      color: var(--text-primary);
    }

    /* --- ADD VIDEO INPUT BOX --- */
    .add-video-box {
      background: var(--bg-surface);
      backdrop-filter: blur(10px);
      padding: 1.5rem;
      border-radius: 12px;
      margin-bottom: 2.5rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      border: 1px solid var(--border-color);
    }

    .input-wrapper {
      flex: 1 1 300px;
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 1rem;
      color: var(--text-secondary);
      width: 20px;
      height: 20px;
    }

    .url-input {
      width: 100%;
      background: var(--bg-base);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 0 1rem 0 3rem;
      height: 3.2rem;
      font-size: 1rem;
      color: white;
      outline: none;
      transition: border 0.2s;
    }

    .url-input:focus {
      border-color: var(--accent-blue);
    }

    .add-btn {
      background: var(--accent-blue);
      border: none;
      border-radius: 8px;
      padding: 0 2rem;
      height: 3.2rem;
      font-size: 1rem;
      font-weight: 700;
      color: white;
      cursor: pointer;
      transition: background 0.2s;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .add-btn:hover { background: var(--accent-blue-hover); }
    .add-btn:disabled { background: #333; color: #666; cursor: not-allowed; }
    .add-btn svg { width: 18px; height: 18px; }

    /* --- PLAYER WRAPPER --- */
    .player-container {
      width: 100%;
      max-width: 1000px;
      aspect-ratio: 16 / 9;
      background: #000;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 2.5rem;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid var(--border-color);
    }

    #youtubeContainer, iframe {
      width: 100%;
      height: 100%;
      border: 0;
      position: absolute;
      top: 0;
      left: 0;
    }

    .error-message {
      color: var(--text-secondary);
      text-align: center;
      padding: 2rem;
      font-size: 1.1rem;
      line-height: 1.6;
      font-weight: 500;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1rem;
    }

    .error-message svg { width: 48px; height: 48px; color: var(--accent-blue); }

    /* --- VIDEO GRID --- */
    .video-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: 2rem;
    }

    .video-card {
      cursor: pointer;
      background: var(--bg-surface);
      border-radius: 12px;
      transition: transform 0.2s ease, border-color 0.2s ease;
      position: relative;
      display: flex;
      flex-direction: column;
      border: 1px solid transparent;
      overflow: hidden;
    }

    .video-card:hover {
      transform: translateY(-4px);
      border-color: var(--border-color);
    }

    .thumbnail-container {
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
      position: relative;
    }

    .thumbnail-container img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .delete-btn {
      position: absolute;
      top: 10px;
      right: 10px;
      background: rgba(0,0,0,0.8);
      color: white;
      border: none;
      border-radius: 6px;
      width: 32px;
      height: 32px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: all 0.2s;
      z-index: 10;
    }

    .delete-btn svg { width: 16px; height: 16px; }
    .video-card:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { background: var(--error-red); }

    .video-info {
      display: flex;
      gap: 14px;
      padding: 1rem;
    }

    .channel-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: var(--bg-elevated);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: var(--accent-blue);
      flex-shrink: 0;
      font-size: 1.1rem;
    }

    .video-text {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    .video-title {
      font-size: 1rem;
      font-weight: 600;
      color: var(--text-primary);
      margin-bottom: 6px;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
      line-height: 1.4;
    }

    .video-author {
      font-size: 0.9rem;
      color: var(--text-secondary);
    }

    .empty-state {
      color: var(--text-secondary);
      font-size: 1.1rem;
      grid-column: 1 / -1;
      text-align: center;
      padding: 4rem;
      background: var(--bg-surface);
      border-radius: 12px;
      border: 1px dashed var(--border-color);
    }

    /* --- UTILITIES --- */
    [hidden] { display: none !important; }
    
    /* Custom Scrollbar */
    ::-webkit-scrollbar { width: 10px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 5px; }
    ::-webkit-scrollbar-thumb:hover { background: var(--accent-blue); }
  </style>
</head>
<body>

  <!-- ANIMATED AURORA BACKGROUND -->
  <div class="aurora-bg">
    <div class="aurora-blob"></div>
    <div class="aurora-blob"></div>
    <div class="aurora-blob"></div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <!-- Custom SVG Logo -->
      <svg class="logo-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
        <path d="M21.582 6.186a2.6 2.6 0 0 0-1.836-1.844C18.09 3.9 12 3.9 12 3.9s-6.09 0-7.746.442a2.6 2.6 0 0 0-1.836 1.844C2 7.863 2 12 2 12s0 4.137.418 5.814a2.6 2.6 0 0 0 1.836 1.844C5.91 20.1 12 20.1 12 20.1s6.09 0 7.746-.442a2.6 2.6 0 0 0 1.836-1.844C22 16.137 22 12 22 12s0-4.137-.418-5.814zM9.9 15.3V8.7l5.8 3.3-5.8 3.3z"/>
      </svg>
      TubeYou
    </div>
    
    <div class="nav-item active" id="navMyVideos">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
      My Library
    </div>
    
    <div class="nav-item" id="navPublicVideos">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      Public Videos
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    
    <!-- MY VIDEOS SECTION -->
    <div id="myVideosSection">
      <div class="section-title">Add to Library</div>
      
      <div class="add-video-box">
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
          <input type="url" id="urlInput" class="url-input" placeholder="Paste a YouTube link here..." spellcheck="false" />
        </div>
        <button id="addBtn" class="add-btn">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          Save Video
        </button>
      </div>

      <!-- Player Area -->
      <div class="player-container" id="playerContainer">
        <div id="defaultMsg" class="error-message">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span>Select a video below or add a new one to start watching.</span>
        </div>
        <div id="youtubeContainer" hidden></div>
      </div>

      <!-- Video Grid -->
      <div class="section-title">Your Videos</div>
      <div class="video-grid" id="myVideoGrid"></div>
    </div>

    <!-- PUBLIC VIDEOS SECTION (Placeholder) -->
    <div id="publicVideosSection" hidden>
      <div class="section-title">Public Videos</div>
      <div class="empty-state">We will build the public videos section later!</div>
    </div>

  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // --- STATE & STORAGE ---
    let myVideos = JSON.parse(localStorage.getItem('tubeYouVideos')) || [];
    let ytPlayer = null;
    let currentYtId = null;

    // --- DOM ELEMENTS ---
    const urlInput = document.getElementById('urlInput');
    const addBtn = document.getElementById('addBtn');
    const myVideoGrid = document.getElementById('myVideoGrid');
    const ytContainer = document.getElementById('youtubeContainer');
    const defaultMsg = document.getElementById('defaultMsg');
    const myVideosSection = document.getElementById('myVideosSection');
    const publicVideosSection = document.getElementById('publicVideosSection');
    const navMyVideos = document.getElementById('navMyVideos');
    const navPublicVideos = document.getElementById('navPublicVideos');

    // --- TAB SWITCHING ---
    navMyVideos.addEventListener('click', () => {
      myVideosSection.hidden = false;
      publicVideosSection.hidden = true;
      navMyVideos.classList.add('active');
      navPublicVideos.classList.remove('active');
    });

    navPublicVideos.addEventListener('click', () => {
      myVideosSection.hidden = true;
      publicVideosSection.hidden = false;
      navPublicVideos.classList.add('active');
      navMyVideos.classList.remove('active');
    });

    // --- YOUTUBE HELPERS ---
    function getYouTubeId(url) {
      try {
        const parsed = new URL(url);
        const host = parsed.hostname.replace('www.', '');
        if (host === 'youtube.com' || host === 'm.youtube.com') return parsed.searchParams.get('v');
        if (host === 'youtu.be') return parsed.pathname.slice(1).split('?')[0];
      } catch (e) { return null; }
      return null;
    }

    function onPlayerError(event) {
      let errorMessage = 'An error occurred while trying to play this video.';
      if (event.data === 101 || event.data === 150) {
        errorMessage = 'This video is not allowed to be played by the creator. There is nothing we can do about this restriction.';
      } else if (event.data === 153) {
        errorMessage = 'Configuration error (153). Ensure you are on a valid domain.';
      }
      
      ytContainer.hidden = true;
      defaultMsg.hidden = false;
      // Keep the icon, update the text
      defaultMsg.innerHTML = `
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg>
        <span>${errorMessage}</span>
      `;
    }

    function playVideo(videoId) {
      if (currentYtId === videoId && ytPlayer) return;
      currentYtId = videoId;

      defaultMsg.hidden = true;
      ytContainer.hidden = false;

      if (window.YT && window.YT.Player) {
        if (ytPlayer) {
          ytPlayer.loadVideoById(videoId);
        } else {
          ytPlayer = new YT.Player('youtubeContainer', {
            height: '100%',
            width: '100%',
            videoId: videoId,
            playerVars: { 'rel': 0, 'autoplay': 1 },
            events: { 'onError': onPlayerError }
          });
        }
      } else {
        setTimeout(() => playVideo(videoId), 500);
      }
    }

    // --- RENDER UI ---
    function renderVideos() {
      myVideoGrid.innerHTML = '';
      
      if (myVideos.length === 0) {
        myVideoGrid.innerHTML = '<div class="empty-state">Your library is empty. Paste a link above to save a video!</div>';
        return;
      }

      myVideos.forEach((video, index) => {
        const card = document.createElement('div');
        card.className = 'video-card';
        
        card.innerHTML = `
          <div class="thumbnail-container">
            <img src="${video.thumbnail}" alt="Thumbnail" loading="lazy" />
            <button class="delete-btn" title="Remove from library">
              <svg viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
            </button>
          </div>
          <div class="video-info">
            <div class="channel-avatar">${video.author.charAt(0).toUpperCase()}</div>
            <div class="video-text">
              <div class="video-title">${video.title}</div>
              <div class="video-author">${video.author}</div>
            </div>
          </div>
        `;

        card.addEventListener('click', (e) => {
          if (e.target.closest('.delete-btn')) return;
          playVideo(video.id);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        const deleteBtn = card.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          myVideos.splice(index, 1);
          localStorage.setItem('tubeYouVideos', JSON.stringify(myVideos));
          renderVideos();
        });

        myVideoGrid.appendChild(card);
      });
    }

    // --- ADD VIDEO LOGIC ---
    addBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) return;

      const ytId = getYouTubeId(url);
      if (!ytId) {
        alert('Please enter a valid YouTube link.');
        return;
      }

      if (myVideos.some(v => v.id === ytId)) {
        alert('Video is already in your library!');
        return;
      }

      const originalBtnHTML = addBtn.innerHTML;
      addBtn.innerHTML = 'Fetching...';
      addBtn.disabled = true;

      try {
        const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${ytId}`);
        const data = await response.json();

        if (data.error) throw new Error('Could not fetch video data.');

        const newVideo = {
          id: ytId,
          title: data.title || 'Unknown Title',
          author: data.author_name || 'Unknown Creator',
          thumbnail: data.thumbnail_url || `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`
        };

        myVideos.unshift(newVideo);
        localStorage.setItem('tubeYouVideos', JSON.stringify(myVideos));
        
        urlInput.value = '';
        renderVideos();

      } catch (err) {
        console.error(err);
        alert('Failed to fetch video details. The video might be private or age-restricted.');
      } finally {
        addBtn.innerHTML = originalBtnHTML;
        addBtn.disabled = false;
      }
    });

    // Support pressing Enter in the input field
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addBtn.click();
    });

    // --- INITIALIZATION ---
    if (!window.YT) {
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    renderVideos();
  </script>
</body>
</html>
