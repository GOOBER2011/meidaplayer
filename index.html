<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeYou</title>
  
  <style>
    /* --- CSS VARIABLES (Black & Blue Theme) --- */
    :root {
      --bg-base: #000000;
      --bg-surface: rgba(10, 15, 25, 0.75);
      --bg-elevated: #0a1122;
      --bg-hover: #112244;
      --text-primary: #ffffff;
      --text-secondary: #8899bb;
      --accent-blue: #0066ff;
      --accent-blue-hover: #3388ff;
      --border-color: #1a2a4a;
      --error-red: #ff3333;
      --sidebar-width: 260px;
      --sidebar-collapsed-width: 72px;
    }

    /* --- AURORA BACKGROUND ANIMATION --- */
    @keyframes auroraMove {
      0% { transform: translate(-10%, -10%) scale(1); }
      50% { transform: translate(10%, 10%) scale(1.2); }
      100% { transform: translate(-10%, -10%) scale(1); }
    }
    .aurora-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; background-color: #000; overflow: hidden; }
    .aurora-blob { position: absolute; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(0,102,255,0.15) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; filter: blur(60px); animation: auroraMove 15s infinite alternate ease-in-out; }
    .aurora-blob:nth-child(2) { top: 20%; left: 50%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(0,51,153,0.2) 0%, rgba(0,0,0,0) 70%); animation-duration: 20s; animation-direction: alternate-reverse; }
    .aurora-blob:nth-child(3) { top: 60%; left: 10%; width: 70vw; height: 70vw; background: radial-gradient(circle, rgba(0,170,255,0.1) 0%, rgba(0,0,0,0) 70%); animation-duration: 25s; animation-delay: -5s; }

    /* --- RESET & GLOBAL --- */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--bg-base); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }
    svg { fill: currentColor; display: block; }
    [hidden] { display: none !important; }

    /* --- SIDEBAR & COLLAPSE --- */
    .sidebar {
      width: var(--sidebar-width);
      background-color: var(--bg-surface);
      backdrop-filter: blur(12px);
      border-right: 1px solid var(--border-color);
      display: flex; flex-direction: column; flex-shrink: 0;
      z-index: 10; transition: width 0.3s ease; overflow: hidden;
    }
    .sidebar.collapsed { width: var(--sidebar-collapsed-width); }
    .sidebar.collapsed .nav-text, 
    .sidebar.collapsed .playlist-header, 
    .sidebar.collapsed .playlist-list { display: none; }
    .sidebar.collapsed .sidebar-header { justify-content: center; padding: 1.5rem 0; }
    .sidebar.collapsed .nav-item { justify-content: center; padding: 1rem 0; border-left: none; }
    .sidebar.collapsed .logo-icon { margin-right: 0; }

    .sidebar-header { display: flex; align-items: center; padding: 1.5rem; font-size: 1.4rem; font-weight: 800; border-bottom: 1px solid var(--border-color); cursor: pointer; transition: all 0.2s; white-space: nowrap; }
    .logo-icon { color: var(--accent-blue); margin-right: 12px; width: 28px; height: 28px; flex-shrink: 0; }

    .nav-item { padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1.2rem; cursor: pointer; color: var(--text-secondary); transition: all 0.2s ease; font-size: 1rem; font-weight: 600; border-left: 3px solid transparent; white-space: nowrap; }
    .nav-item svg { width: 22px; height: 22px; flex-shrink: 0; }
    .nav-item:hover { background-color: var(--bg-hover); color: var(--text-primary); }
    .nav-item.active { background-color: var(--bg-elevated); color: var(--accent-blue); border-left: 3px solid var(--accent-blue); }

    /* Playlists in Sidebar */
    .playlist-header { padding: 1.5rem 1.5rem 0.5rem; font-size: 0.85rem; font-weight: 700; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: space-between; align-items: center; }
    .create-pl-btn { cursor: pointer; color: var(--accent-blue); font-size: 1.2rem; line-height: 1; }
    .playlist-list { display: flex; flex-direction: column; overflow-y: auto; }
    .playlist-item { padding: 0.6rem 1.5rem; cursor: pointer; color: var(--text-secondary); font-size: 0.95rem; transition: background 0.15s; white-space: nowrap; display: flex; justify-content: space-between; align-items: center; }
    .playlist-item:hover { background: var(--bg-hover); color: white; }
    .playlist-item.active { color: var(--accent-blue); background: var(--bg-elevated); }
    .del-pl-btn { color: var(--text-secondary); opacity: 0; cursor: pointer; }
    .playlist-item:hover .del-pl-btn { opacity: 1; }

    /* --- MAIN CONTENT AREA --- */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 2rem 3rem; }
    .section-title { font-size: 1.4rem; margin-bottom: 1.2rem; font-weight: 700; display: flex; justify-content: space-between; align-items: center; }

    /* --- ADD VIDEO INPUT BOX --- */
    .add-video-box { background: var(--bg-surface); backdrop-filter: blur(10px); padding: 1.5rem; border-radius: 12px; margin-bottom: 2.5rem; display: flex; gap: 1rem; flex-wrap: wrap; border: 1px solid var(--border-color); }
    .input-wrapper { flex: 1 1 300px; position: relative; display: flex; align-items: center; }
    .input-icon { position: absolute; left: 1rem; color: var(--text-secondary); width: 20px; height: 20px; }
    .url-input { width: 100%; background: var(--bg-base); border: 1px solid var(--border-color); border-radius: 8px; padding: 0 1rem 0 3rem; height: 3.2rem; font-size: 1rem; color: white; outline: none; transition: border 0.2s; }
    .url-input:focus { border-color: var(--accent-blue); }
    
    .add-btn { background: var(--accent-blue); border: none; border-radius: 8px; padding: 0 2rem; height: 3.2rem; font-size: 1rem; font-weight: 700; color: white; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; gap: 0.5rem; }
    .add-btn:hover { background: var(--accent-blue-hover); }
    .add-btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    /* --- TOOLBAR (Bulk Actions) --- */
    .toolbar { display: flex; gap: 1rem; align-items: center; margin-bottom: 1rem; background: var(--bg-surface); padding: 0.8rem 1.2rem; border-radius: 8px; border: 1px solid var(--border-color); }
    .toolbar-btn { background: transparent; border: 1px solid var(--border-color); color: white; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; font-size: 0.9rem; transition: all 0.2s; }
    .toolbar-btn:hover { background: var(--bg-hover); }
    .toolbar-btn.danger { color: var(--error-red); border-color: var(--error-red); }
    .toolbar-btn.danger:hover { background: rgba(255, 51, 51, 0.1); }
    .toolbar-select { background: var(--bg-base); color: white; border: 1px solid var(--border-color); padding: 0.5rem; border-radius: 6px; outline: none; }

    /* --- PLAYER WRAPPER --- */
    .player-container { width: 100%; max-width: 1000px; aspect-ratio: 16 / 9; background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 2.5rem; position: relative; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); }
    #youtubeContainer, iframe { width: 100%; height: 100%; border: 0; position: absolute; top: 0; left: 0; }
    .error-message { color: var(--text-secondary); text-align: center; padding: 2rem; font-size: 1.1rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .error-message svg { width: 48px; height: 48px; color: var(--accent-blue); }

    /* --- VIDEO GRID --- */
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 2rem; }
    .video-card { cursor: pointer; background: var(--bg-surface); border-radius: 12px; transition: transform 0.2s, border-color 0.2s; position: relative; display: flex; flex-direction: column; border: 1px solid transparent; overflow: hidden; }
    .video-card:hover { transform: translateY(-4px); border-color: var(--border-color); }
    .video-card.selected { border-color: var(--accent-blue); background: rgba(0, 102, 255, 0.1); }

    .thumbnail-container { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; }
    .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; }
    
    /* Custom Checkbox */
    .card-checkbox { position: absolute; top: 10px; left: 10px; width: 24px; height: 24px; cursor: pointer; z-index: 10; accent-color: var(--accent-blue); transform: scale(1.2); }

    .video-info { display: flex; gap: 14px; padding: 1rem; }
    .channel-avatar { width: 40px; height: 40px; border-radius: 50%; background: var(--bg-elevated); object-fit: cover; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--accent-blue); }
    .video-text { display: flex; flex-direction: column; overflow: hidden; }
    .video-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 6px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; }
    .video-author { font-size: 0.9rem; color: var(--text-secondary); }

    .empty-state { color: var(--text-secondary); font-size: 1.1rem; grid-column: 1 / -1; text-align: center; padding: 4rem; background: var(--bg-surface); border-radius: 12px; border: 1px dashed var(--border-color); }

    /* --- MODALS (Custom Prompts) --- */
    .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); backdrop-filter: blur(5px); display: flex; align-items: center; justify-content: center; z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.active { opacity: 1; pointer-events: all; }
    .modal { background: var(--bg-elevated); border: 1px solid var(--border-color); border-radius: 12px; padding: 2rem; width: 90%; max-width: 400px; text-align: center; }
    .modal h3 { margin-bottom: 1rem; font-size: 1.3rem; }
    .modal p { color: var(--text-secondary); margin-bottom: 1.5rem; font-size: 0.95rem; }
    .modal-input { width: 100%; background: var(--bg-base); border: 1px solid var(--border-color); color: white; padding: 0.8rem; border-radius: 6px; margin-bottom: 1.5rem; outline: none; }
    .modal-input:focus { border-color: var(--accent-blue); }
    .modal-actions { display: flex; gap: 1rem; justify-content: center; }
    .modal-btn { padding: 0.7rem 1.5rem; border-radius: 6px; border: none; font-weight: bold; cursor: pointer; transition: all 0.2s; }
    .modal-btn.cancel { background: transparent; color: white; border: 1px solid var(--border-color); }
    .modal-btn.confirm { background: var(--error-red); color: white; }
    .modal-btn.primary { background: var(--accent-blue); color: white; }

    /* Utilities */
    ::-webkit-scrollbar { width: 8px; }
    ::-webkit-scrollbar-track { background: var(--bg-base); }
    ::-webkit-scrollbar-thumb { background: var(--bg-hover); border-radius: 4px; }
  </style>
</head>
<body>

  <div class="aurora-bg">
    <div class="aurora-blob"></div><div class="aurora-blob"></div><div class="aurora-blob"></div>
  </div>

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sidebar-header" id="sidebarToggle">
      <svg class="logo-icon" viewBox="0 0 24 24"><path d="M21.582 6.186a2.6 2.6 0 0 0-1.836-1.844C18.09 3.9 12 3.9 12 3.9s-6.09 0-7.746.442a2.6 2.6 0 0 0-1.836 1.844C2 7.863 2 12 2 12s0 4.137.418 5.814a2.6 2.6 0 0 0 1.836 1.844C5.91 20.1 12 20.1 12 20.1s6.09 0 7.746-.442a2.6 2.6 0 0 0 1.836-1.844C22 16.137 22 12 22 12s0-4.137-.418-5.814zM9.9 15.3V8.7l5.8 3.3-5.8 3.3z"/></svg>
      <span class="nav-text">TubeYou</span>
    </div>
    
    <div class="nav-item active" data-view="all">
      <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
      <span class="nav-text">All Videos</span>
    </div>
    
    <div class="nav-item" data-view="public">
      <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
      <span class="nav-text">Public Videos</span>
    </div>

    <div class="playlist-header">
      <span>Playlists</span>
      <span class="create-pl-btn" id="createPlaylistBtn" title="Create Playlist">+</span>
    </div>
    <div class="playlist-list" id="playlistList">
      <!-- Playlists injected here -->
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    <div id="appView">
      <div class="section-title">Add to Library</div>
      
      <div class="add-video-box">
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
          <input type="url" id="urlInput" class="url-input" placeholder="Paste a YouTube link here..." spellcheck="false" />
        </div>
        <button id="addBtn" class="add-btn">
          <svg viewBox="0 0 24 24"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          Save Video
        </button>
      </div>

      <div class="player-container" id="playerContainer">
        <div id="defaultMsg" class="error-message">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span>Select a video to start watching.</span>
        </div>
        <div id="youtubeContainer" hidden></div>
      </div>

      <div class="section-title" id="viewTitle">Your Videos</div>
      
      <!-- Bulk Actions Toolbar -->
      <div class="toolbar" id="bulkToolbar">
        <span style="font-size:0.9rem; font-weight:bold;">Bulk Actions:</span>
        <select class="toolbar-select" id="bulkPlaylistSelect">
          <option value="">-- Add to Playlist --</option>
          <!-- Playlists injected here -->
        </select>
        <button class="toolbar-btn" id="bulkAddBtn">Add</button>
        <button class="toolbar-btn danger" id="bulkDeleteBtn" style="margin-left:auto;">
          <svg style="display:inline; width:16px; height:16px; margin-bottom:-3px;" viewBox="0 0 24 24"><path d="M6 19c0 1.1.9 2 2 2h8c1.1 0 2-.9 2-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/></svg>
          Delete Selected
        </button>
      </div>

      <div class="video-grid" id="myVideoGrid"></div>
    </div>

    <!-- PUBLIC VIEW PLACEHOLDER -->
    <div id="publicView" hidden>
      <div class="section-title">Public Videos</div>
      <div class="empty-state">Coming soon...</div>
    </div>
  </div>

  <!-- MODALS -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modalContent">
      <h3 id="modalTitle">Title</h3>
      <p id="modalDesc">Description</p>
      <input type="text" id="modalInput" class="modal-input" hidden />
      <div class="modal-actions">
        <button class="modal-btn cancel" id="modalCancel">Cancel</button>
        <button class="modal-btn confirm" id="modalConfirm">Confirm</button>
      </div>
    </div>
  </div>

  <script>
    // --- STATE & STORAGE ---
    let savedVideos = JSON.parse(localStorage.getItem('tubeYouVideos')) || [];
    let savedPlaylists = JSON.parse(localStorage.getItem('tubeYouPlaylists')) || [];
    let currentView = 'all'; // 'all', 'public', or playlistId
    let selectedVideos = new Set(); // Stores IDs of selected videos
    let ytPlayer = null;
    let currentYtId = null;

    // --- DOM ELEMENTS ---
    const urlInput = document.getElementById('urlInput');
    const addBtn = document.getElementById('addBtn');
    const myVideoGrid = document.getElementById('myVideoGrid');
    const ytContainer = document.getElementById('youtubeContainer');
    const defaultMsg = document.getElementById('defaultMsg');
    const appView = document.getElementById('appView');
    const publicView = document.getElementById('publicView');
    const viewTitle = document.getElementById('viewTitle');
    const sidebar = document.getElementById('sidebar');
    const playlistList = document.getElementById('playlistList');
    const bulkPlaylistSelect = document.getElementById('bulkPlaylistSelect');

    // Modal Elements
    const modalOverlay = document.getElementById('modalOverlay');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const modalInput = document.getElementById('modalInput');
    const modalConfirm = document.getElementById('modalConfirm');
    const modalCancel = document.getElementById('modalCancel');
    let modalAction = null;

    // --- MODAL SYSTEM ---
    function showModal(title, desc, isPrompt, confirmText, action) {
      modalTitle.innerText = title;
      modalDesc.innerText = desc;
      modalInput.hidden = !isPrompt;
      modalInput.value = '';
      modalConfirm.innerText = confirmText;
      modalConfirm.className = isPrompt ? 'modal-btn primary' : 'modal-btn confirm';
      
      if (isPrompt) modalInput.focus();
      
      modalAction = action;
      modalOverlay.classList.add('active');
    }

    function closeModal() {
      modalOverlay.classList.remove('active');
      modalAction = null;
    }

    modalCancel.onclick = closeModal;
    modalConfirm.onclick = () => {
      if (modalAction) modalAction(modalInput.value);
      closeModal();
    };

    // --- YOUTUBE & METADATA ---
    function getYouTubeId(url) {
      try {
        const parsed = new URL(url);
        const host = parsed.hostname.replace('www.', '');
        if (host === 'youtube.com' || host === 'm.youtube.com') return parsed.searchParams.get('v');
        if (host === 'youtu.be') return parsed.pathname.slice(1).split('?')[0];
      } catch (e) { return null; }
      return null;
    }

    async function fetchVideoMetadata(ytId) {
      // 1. Get Title, Author, Thumbnail
      const noembedRes = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${ytId}`);
      const noembedData = await noembedRes.json();
      if (noembedData.error) throw new Error('Video unavailable');

      let authorAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(noembedData.author_name)}&background=0a1122&color=0066ff&bold=true`;
      
      // 2. Get Author Avatar using a free YouTube API proxy
      try {
        const apiRes = await fetch(`https://returnyoutubedislikeapi.com/votes?videoId=${ytId}`);
        const apiData = await apiRes.json();
        // This API provides the channel ID, but to get the avatar we'd need another call.
        // Instead, we use a reliable YouTube thumbnail trick for avatars if we can't get the ID.
        // The noembed data actually sometimes includes the author_url which has the channel ID!
        if (noembedData.author_url) {
           const channelId = noembedData.author_url.split('/channel/')[1];
           if (channelId) {
             // We can't easily get the exact image without the API key, so we use the channel's unique avatar via unavatar.io
             authorAvatar = `https://unavatar.io/youtube/${channelId}`;
           }
        }
      } catch (e) {
        console.warn('Could not fetch channel avatar, using fallback.');
      }

      return {
        id: ytId,
        title: noembedData.title,
        author: noembedData.author_name,
        thumbnail: noembedData.thumbnail_url || `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`,
        avatar: authorAvatar
      };
    }

    function onPlayerError(event) {
      let errorMessage = 'An error occurred while trying to play this video.';
      if (event.data === 101 || event.data === 150) {
        errorMessage = 'This video is not allowed to be played by the creator.';
      }
      ytContainer.hidden = true;
      defaultMsg.hidden = false;
      defaultMsg.innerHTML = `<svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/></svg><span>${errorMessage}</span>`;
    }

    function playVideo(videoId) {
      if (currentYtId === videoId && ytPlayer) return;
      currentYtId = videoId;
      defaultMsg.hidden = true;
      ytContainer.hidden = false;

      if (window.YT && window.YT.Player) {
        if (ytPlayer) ytPlayer.loadVideoById(videoId);
        else {
          ytPlayer = new YT.Player('youtubeContainer', {
            height: '100%', width: '100%', videoId: videoId,
            playerVars: { 'rel': 0, 'autoplay': 1 },
            events: { 'onError': onPlayerError }
          });
        }
      } else setTimeout(() => playVideo(videoId), 500);
    }

    // --- RENDER LOGIC ---
    function renderSidebar() {
      playlistList.innerHTML = '';
      savedPlaylists.forEach(pl => {
        const el = document.createElement('div');
        el.className = `playlist-item ${currentView === pl.id ? 'active' : ''}`;
        el.innerHTML = `
          <span style="overflow:hidden; text-overflow:ellipsis;">📁 ${pl.name}</span>
          <span class="del-pl-btn" title="Delete Playlist">×</span>
        `;
        
        el.onclick = (e) => {
          if (e.target.classList.contains('del-pl-btn')) {
            e.stopPropagation();
            showModal('Delete Playlist', `Are you sure you want to delete "${pl.name}"? (Videos will not be deleted, just the playlist)`, false, 'Delete', () => {
              savedPlaylists = savedPlaylists.filter(p => p.id !== pl.id);
              localStorage.setItem('tubeYouPlaylists', JSON.stringify(savedPlaylists));
              if (currentView === pl.id) switchView('all');
              renderSidebar();
            });
          } else {
            switchView(pl.id);
          }
        };
        playlistList.appendChild(el);
      });

      // Update Bulk Select Dropdown
      bulkPlaylistSelect.innerHTML = '<option value="">-- Add to Playlist --</option>';
      savedPlaylists.forEach(pl => {
        bulkPlaylistSelect.innerHTML += `<option value="${pl.id}">${pl.name}</option>`;
      });
    }

    function renderVideos() {
      myVideoGrid.innerHTML = '';
      let videosToShow = savedVideos;

      if (currentView === 'public') {
        appView.hidden = true;
        publicView.hidden = false;
        return;
      }
      
      appView.hidden = false;
      publicView.hidden = true;

      if (currentView !== 'all') {
        const pl = savedPlaylists.find(p => p.id === currentView);
        videosToShow = savedVideos.filter(v => pl && pl.videos.includes(v.id));
        viewTitle.innerText = `Playlist: ${pl ? pl.name : 'Unknown'}`;
      } else {
        viewTitle.innerText = 'Your Videos';
      }

      if (videosToShow.length === 0) {
        myVideoGrid.innerHTML = '<div class="empty-state">No videos here yet.</div>';
        return;
      }

      videosToShow.forEach((video, index) => {
        const card = document.createElement('div');
        const isSelected = selectedVideos.has(video.id);
        card.className = `video-card ${isSelected ? 'selected' : ''}`;
        
        card.innerHTML = `
          <div class="thumbnail-container">
            <input type="checkbox" class="card-checkbox" ${isSelected ? 'checked' : ''} />
            <img src="${video.thumbnail}" alt="Thumbnail" loading="lazy" />
          </div>
          <div class="video-info">
            <img src="${video.avatar}" class="channel-avatar" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';" />
            <div class="channel-avatar" style="display:none;">${video.author.charAt(0)}</div>
            <div class="video-text">
              <div class="video-title">${video.title}</div>
              <div class="video-author">${video.author}</div>
            </div>
          </div>
        `;

        // Checkbox Logic
        const checkbox = card.querySelector('.card-checkbox');
        checkbox.addEventListener('change', (e) => {
          if (e.target.checked) selectedVideos.add(video.id);
          else selectedVideos.delete(video.id);
          card.classList.toggle('selected', e.target.checked);
        });

        // Click to Play
        card.addEventListener('click', (e) => {
          if (e.target.closest('.card-checkbox')) return;
          playVideo(video.id);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        myVideoGrid.appendChild(card);
      });
    }

    function switchView(viewId) {
      currentView = viewId;
      selectedVideos.clear();
      
      document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
      if (viewId === 'all') document.querySelector('[data-view="all"]').classList.add('active');
      if (viewId === 'public') document.querySelector('[data-view="public"]').classList.add('active');
      
      renderSidebar();
      renderVideos();
    }

    // --- EVENT LISTENERS ---

    // Sidebar Collapse
    document.getElementById('sidebarToggle').addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
    });

    // Navigation
    document.querySelector('[data-view="all"]').onclick = () => switchView('all');
    document.querySelector('[data-view="public"]').onclick = () => switchView('public');

    // Create Playlist
    document.getElementById('createPlaylistBtn').onclick = () => {
      showModal('Create Playlist', 'Enter a name for your new playlist:', true, 'Create', (name) => {
        if (!name.trim()) return;
        savedPlaylists.push({ id: 'pl_' + Date.now(), name: name.trim(), videos: [] });
        localStorage.setItem('tubeYouPlaylists', JSON.stringify(savedPlaylists));
        renderSidebar();
      });
    };

    // Add Video
    addBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) return;
      const ytId = getYouTubeId(url);
      if (!ytId) return alert('Invalid YouTube link');
      if (savedVideos.some(v => v.id === ytId)) return alert('Video already in library');

      addBtn.disabled = true;
      addBtn.innerText = 'Fetching...';

      try {
        const newVideo = await fetchVideoMetadata(ytId);
        savedVideos.unshift(newVideo);
        localStorage.setItem('tubeYouVideos', JSON.stringify(savedVideos));
        urlInput.value = '';
        renderVideos();
      } catch (err) {
        alert('Failed to fetch video. It may be private or restricted.');
      } finally {
        addBtn.disabled = false;
        addBtn.innerText = 'Save Video';
      }
    });

    // Bulk Add to Playlist
    document.getElementById('bulkAddBtn').onclick = () => {
      const plId = bulkPlaylistSelect.value;
      if (!plId) return alert('Select a playlist first.');
      if (selectedVideos.size === 0) return alert('Select some videos first.');
      
      const pl = savedPlaylists.find(p => p.id === plId);
      selectedVideos.forEach(vid => {
        if (!pl.videos.includes(vid)) pl.videos.push(vid);
      });
      
      localStorage.setItem('tubeYouPlaylists', JSON.stringify(savedPlaylists));
      alert(`Added ${selectedVideos.size} video(s) to ${pl.name}.`);
      selectedVideos.clear();
      renderVideos();
    };

    // Bulk Delete
    document.getElementById('bulkDeleteBtn').onclick = () => {
      if (selectedVideos.size === 0) return alert('Select videos to delete.');
      
      showModal('Delete Videos', `Are you sure you want to permanently delete ${selectedVideos.size} video(s) from your library?`, false, 'Delete', () => {
        savedVideos = savedVideos.filter(v => !selectedVideos.has(v.id));
        
        // Remove from playlists too
        savedPlaylists.forEach(pl => {
          pl.videos = pl.videos.filter(vid => !selectedVideos.has(vid));
        });

        localStorage.setItem('tubeYouVideos', JSON.stringify(savedVideos));
        localStorage.setItem('tubeYouPlaylists', JSON.stringify(savedPlaylists));
        
        selectedVideos.clear();
        renderVideos();
      });
    };

    // --- INIT ---
    if (!window.YT) {
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    renderSidebar();
    renderVideos();
  </script>
</body>
</html>
