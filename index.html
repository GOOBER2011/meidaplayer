<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Media Player (YouTube + Direct Files)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1d23;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .player-card {
      max-width: 900px;
      width: 100%;
      background: #0f1115;
      border-radius: 2rem;
      padding: 2rem;
      box-shadow: 0 25px 40px -12px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
    }
    h1 {
      font-size: 1.5rem;
      color: #eef2f6;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
    }
    h1 span {
      background: #2f3542;
      font-size: 0.8rem;
      font-weight: 400;
      padding: 0.2rem 0.8rem;
      border-radius: 100px;
      color: #b0b8c5;
    }
    .input-group {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .url-input {
      flex: 1 1 280px;
      background: #1e2128;
      border: 1px solid #2c313c;
      border-radius: 60px;
      padding: 0 1.5rem;
      height: 3.2rem;
      font-size: 1rem;
      color: #eef2f6;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      min-width: 0;
    }
    .url-input::placeholder { color: #6b7482; }
    .url-input:focus {
      border-color: #4a7db5;
      box-shadow: 0 0 0 3px rgba(74,125,181,0.25);
    }
    .load-btn {
      background: #2d7aff;
      border: none;
      border-radius: 60px;
      padding: 0 2.2rem;
      height: 3.2rem;
      font-size: 1rem;
      font-weight: 500;
      color: white;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .load-btn:hover { background: #1f6ae0; }
    .load-btn:active { transform: scale(0.97); }

    .player-wrapper {
      background: #050608;
      border-radius: 1.5rem;
      overflow: hidden;
      border: 1px solid #252a33;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .player-wrapper.video-mode {
      aspect-ratio: 16 / 9;
    }
    .player-wrapper.audio-mode {
      padding: 1.5rem 1rem;
      aspect-ratio: auto;
    }
    .player-wrapper iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      background: black;
      object-fit: contain;
    }
    audio {
      width: 100%;
      display: block;
    }
    .message {
      color: #7d8796;
      font-size: 1rem;
      text-align: center;
      padding: 2rem;
      line-height: 1.5;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.9rem;
      font-size: 0.85rem;
      color: #8f9aa8;
      padding: 0 0.5rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .source-hint {
      background: #1c2028;
      padding: 0.25rem 0.9rem;
      border-radius: 40px;
      color: #b7c1d0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 70%;
    }
    .clear-btn {
      background: none;
      border: 1px solid #2e3540;
      color: #b6c0cd;
      border-radius: 40px;
      padding: 0.25rem 1rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .clear-btn:hover { background: #252b34; color: white; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="player-card">
    <h1>🎬 URL Player <span>YouTube &amp; files</span></h1>

    <div class="input-group">
      <input
        type="url"
        id="urlInput"
        class="url-input"
        placeholder="Paste YouTube link OR direct video/audio URL"
        value="https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        spellcheck="false"
        aria-label="Media URL"
      />
      <button id="loadBtn" class="load-btn" type="button">▶ Play</button>
    </div>

    <div id="playerWrapper" class="player-wrapper">
      <div id="defaultMessage" class="message">
        ⚡ Paste a link and click <strong>Play</strong>
      </div>
      <video id="videoPlayer" controls playsinline preload="metadata" hidden></video>
      <audio id="audioPlayer" controls preload="metadata" hidden></audio>
      <iframe id="youtubePlayer" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen hidden></iframe>
    </div>

    <div class="status-bar">
      <span id="sourceLabel" class="source-hint">No media loaded</span>
      <button id="clearBtn" class="clear-btn" type="button">Clear</button>
    </div>
  </div>

  <script>
    (function () {
      const urlInput      = document.getElementById('urlInput');
      const loadBtn       = document.getElementById('loadBtn');
      const videoPlayer   = document.getElementById('videoPlayer');
      const audioPlayer   = document.getElementById('audioPlayer');
      const youtubePlayer = document.getElementById('youtubePlayer');
      const playerWrapper = document.getElementById('playerWrapper');
      const defaultMsg    = document.getElementById('defaultMessage');
      const sourceLabel   = document.getElementById('sourceLabel');
      const clearBtn      = document.getElementById('clearBtn');

      // Extract YouTube video ID from various URL formats, stripping extra params
      function getYouTubeId(url) {
        try {
          const parsed = new URL(url);
          const host = parsed.hostname.replace('www.', '');
          if (host === 'youtube.com' || host === 'm.youtube.com') {
            // Strip &t= and other params, only use the v= value
            return parsed.searchParams.get('v');
          }
          if (host === 'youtu.be') {
            return parsed.pathname.slice(1).split('?')[0];
          }
          if (host === 'youtube.com' && parsed.pathname.startsWith('/embed/')) {
            return parsed.pathname.split('/')[2];
          }
        } catch (e) { /* not a valid URL */ }
        return null;
      }

      function resetPlayer(message) {
        videoPlayer.hidden = true;
        videoPlayer.pause();
        videoPlayer.removeAttribute('src');
        videoPlayer.load();

        audioPlayer.hidden = true;
        audioPlayer.pause();
        audioPlayer.removeAttribute('src');
        audioPlayer.load();

        youtubePlayer.hidden = true;
        youtubePlayer.removeAttribute('src');

        playerWrapper.classList.remove('video-mode', 'audio-mode');
        playerWrapper.classList.add('video-mode');

        defaultMsg.hidden = false;
        defaultMsg.innerHTML = message || '⚡ Paste a link and click <strong>Play</strong>';
        sourceLabel.textContent = 'No media loaded';
      }

      function showVideo() {
        defaultMsg.hidden = true;
        audioPlayer.hidden = true;
        youtubePlayer.hidden = true;
        videoPlayer.hidden = false;
        playerWrapper.classList.remove('audio-mode');
        playerWrapper.classList.add('video-mode');
      }

      function showAudio() {
        defaultMsg.hidden = true;
        videoPlayer.hidden = true;
        youtubePlayer.hidden = true;
        audioPlayer.hidden = false;
        playerWrapper.classList.remove('video-mode');
        playerWrapper.classList.add('audio-mode');
      }

      function showYouTube() {
        defaultMsg.hidden = true;
        videoPlayer.hidden = true;
        audioPlayer.hidden = true;
        youtubePlayer.hidden = false;
        playerWrapper.classList.remove('audio-mode');
        playerWrapper.classList.add('video-mode');
      }

      function guessDirectType(url) {
        const path = url.split('?')[0].split('#')[0].toLowerCase();
        const audioExts = ['.mp3', '.wav', '.m4a', '.aac', '.flac', '.opus', '.oga'];
        if (audioExts.some(ext => path.endsWith(ext))) return 'audio';
        return 'video';
      }

      function loadFromInput() {
        const url = urlInput.value.trim();
        if (!url) {
          resetPlayer('⚠️ Please enter a URL');
          return;
        }

        // Check for YouTube first
        const ytId = getYouTubeId(url);
        if (ytId) {
          // Use the embed format and REMOVE any extra parameters like &t=1s
          const embedUrl = `https://www.youtube.com/embed/${ytId}?rel=0`;
          showYouTube();
          youtubePlayer.src = embedUrl;
          sourceLabel.textContent = '📡 YouTube: ' + ytId;
          return;
        }

        // Validate as direct media URL
        let parsed;
        try {
          parsed = new URL(url.startsWith('//') ? 'https:' + url : url);
        } catch (e) {
          resetPlayer('❌ Invalid URL format');
          return;
        }

        if (!['http:', 'https:', 'blob:', 'data:'].includes(parsed.protocol)) {
          resetPlayer('⛔ Unsupported URL scheme');
          return;
        }

        const type = guessDirectType(url);
        sourceLabel.textContent = '📡 ' + (url.length > 60 ? url.slice(0, 57) + '…' : url);

        if (type === 'audio') {
          showAudio();
          audioPlayer.src = url;
          audioPlayer.load();
          const p = audioPlayer.play();
          if (p) p.catch(err => console.warn('Autoplay blocked:', err));
        } else {
          showVideo();
          videoPlayer.src = url;
          videoPlayer.load();
          const p = videoPlayer.play();
          if (p) p.catch(err => console.warn('Autoplay blocked:', err));
        }
      }

      loadBtn.addEventListener('click', loadFromInput);

      urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          e.preventDefault();
          loadFromInput();
        }
      });

      clearBtn.addEventListener('click', () => {
        urlInput.value = '';
        urlInput.focus();
        resetPlayer('⚡ Paste a link and click <strong>Play</strong>');
      });

      videoPlayer.addEventListener('error', () => {
        if (videoPlayer.src && !videoPlayer.hidden) {
          resetPlayer('⚠️ Could not load video. Check the URL or file format.');
        }
      });

      audioPlayer.addEventListener('error', () => {
        if (audioPlayer.src && !audioPlayer.hidden) {
          resetPlayer('⚠️ Could not load audio. Check the URL or file format.');
        }
      });

      resetPlayer('⚡ Paste a link and click <strong>Play</strong>');
    })();
  </script>
</body>
</html>
