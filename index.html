<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL Media Player (YouTube + Proxy)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #1a1d23;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
    }
    .player-card {
      max-width: 900px;
      width: 100%;
      background: #0f1115;
      border-radius: 2rem;
      padding: 2rem;
      box-shadow: 0 25px 40px -12px rgba(0,0,0,0.8), 0 0 0 1px rgba(255,255,255,0.05);
    }
    h1 {
      font-size: 1.5rem;
      color: #eef2f6;
      margin-bottom: 1.2rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-weight: 500;
    }
    h1 span {
      background: #2f3542;
      font-size: 0.8rem;
      font-weight: 400;
      padding: 0.2rem 0.8rem;
      border-radius: 100px;
      color: #b0b8c5;
    }
    .input-group {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.2rem;
      flex-wrap: wrap;
    }
    .url-input {
      flex: 1 1 280px;
      background: #1e2128;
      border: 1px solid #2c313c;
      border-radius: 60px;
      padding: 0 1.5rem;
      height: 3.2rem;
      font-size: 1rem;
      color: #eef2f6;
      outline: none;
      transition: border 0.2s, box-shadow 0.2s;
      min-width: 0;
    }
    .url-input::placeholder { color: #6b7482; }
    .url-input:focus {
      border-color: #4a7db5;
      box-shadow: 0 0 0 3px rgba(74,125,181,0.25);
    }
    .load-btn {
      background: #2d7aff;
      border: none;
      border-radius: 60px;
      padding: 0 2.2rem;
      height: 3.2rem;
      font-size: 1rem;
      font-weight: 500;
      color: white;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      white-space: nowrap;
    }
    .load-btn:hover { background: #1f6ae0; }
    .load-btn:active { transform: scale(0.97); }

    .player-wrapper {
      background: #050608;
      border-radius: 1.5rem;
      overflow: hidden;
      border: 1px solid #252a33;
      min-height: 200px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .player-wrapper.video-mode {
      aspect-ratio: 16 / 9;
    }
    .player-wrapper.audio-mode {
      padding: 1.5rem 1rem;
      aspect-ratio: auto;
    }
    #youtubeContainer, iframe {
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      position: absolute;
      top: 0;
      left: 0;
    }
    video {
      width: 100%;
      height: 100%;
      display: block;
      background: black;
      object-fit: contain;
    }
    audio {
      width: 100%;
      display: block;
    }
    .message {
      color: #7d8796;
      font-size: 1rem;
      text-align: center;
      padding: 2rem;
      line-height: 1.5;
    }
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 0.9rem;
      font-size: 0.85rem;
      color: #8f9aa8;
      padding: 0 0.5rem;
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .source-hint {
      background: #1c2028;
      padding: 0.25rem 0.9rem;
      border-radius: 40px;
      color: #b7c1d0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 70%;
    }
    .clear-btn {
      background: none;
      border: 1px solid #2e3540;
      color: #b6c0cd;
      border-radius: 40px;
      padding: 0.25rem 1rem;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.15s;
    }
    .clear-btn:hover { background: #252b34; color: white; }
    [hidden] { display: none !important; }
  </style>
  <!-- Load the YouTube IFrame API -->
  <script src="https://www.youtube.com/iframe_api"></script>
</head>
<body>
  <div class="player-card">
    <h1>🎬 URL Player <span>YouTube &amp; Proxy</span></h1>

    <div class="input-group">
      <input
        type="url"
        id="urlInput"
        class="url-input"
        placeholder="Paste YouTube link OR direct video/audio URL"
        value="https://www.youtube.com/watch?v=dQw4w9WgXcQ"
        spellcheck="false"
        aria-label="Media URL"
      />
      <button id="loadBtn" class="load-btn" type="button">▶ Play</button>
    </div>

    <div id="playerWrapper" class="player-wrapper">
      <div id="defaultMessage" class="message">
        ⚡ Paste a link and click <strong>Play</strong>
      </div>
      <video id="videoPlayer" controls playsinline preload="metadata" hidden></video>
      <audio id="audioPlayer" controls preload="metadata" hidden></audio>
      <!-- Container for the YouTube Player API -->
      <div id="youtubeContainer" hidden></div>
    </div>

    <div class="status-bar">
      <span id="sourceLabel" class="source-hint">No media loaded</span>
      <button id="clearBtn" class="clear-btn" type="button">Clear</button>
    </div>
  </div>

  <script>
    (function () {
      const urlInput      = document.getElementById('urlInput');
      const loadBtn       = document.getElementById('loadBtn');
      const videoPlayer   = document.getElementById('videoPlayer');
      const audioPlayer   = document.getElementById('audioPlayer');
      const ytContainer   = document.getElementById('youtubeContainer');
      const playerWrapper = document.getElementById('playerWrapper');
      const defaultMsg    = document.getElementById('defaultMessage');
      const sourceLabel   = document.getElementById('sourceLabel');
      const clearBtn      = document.getElementById('clearBtn');

      let ytPlayer = null; // Holds the YouTube Player instance

      // Extract YouTube video ID
      function getYouTubeId(url) {
        try {
          const parsed = new URL(url);
          const host = parsed.hostname.replace('www.', '');
          if (host === 'youtube.com' || host === 'm.youtube.com') {
            return parsed.searchParams.get('v');
          }
          if (host === 'youtu.be') {
            return parsed.pathname.slice(1).split('?')[0];
          }
        } catch (e) { /* not a valid URL */ }
        return null;
      }

      function resetPlayer(message) {
        videoPlayer.hidden = true;
        videoPlayer.pause();
        videoPlayer.removeAttribute('src');
        videoPlayer.load();

        audioPlayer.hidden = true;
        audioPlayer.pause();
        audioPlayer.removeAttribute('src');
        audioPlayer.load();

        ytContainer.hidden = true;
        if (ytPlayer) {
          ytPlayer.destroy();
          ytPlayer = null;
        }

        playerWrapper.classList.remove('video-mode', 'audio-mode');
        playerWrapper.classList.add('video-mode');

        defaultMsg.hidden = false;
        defaultMsg.innerHTML = message || '⚡ Paste a link and click <strong>Play</strong>';
        sourceLabel.textContent = 'No media loaded';
      }

      // Handler for YouTube errors
      function onPlayerError(event) {
        let errorMessage = '⚠️ An error occurred while trying to play this video.';
        
        // 101 and 150 mean embedding is disabled by the creator
        if (event.data === 101 || event.data === 150) {
          errorMessage = '⛔ This video is not allowed to be played by the creator. There is nothing I can do about this restriction.';
        } else if (event.data === 153) {
          errorMessage = '⚠️ Configuration error (153). Ensure you are on a valid domain (not file://).';
        }
        
        resetPlayer(errorMessage);
      }

      function playYouTube(videoId) {
        defaultMsg.hidden = true;
        videoPlayer.hidden = true;
        audioPlayer.hidden = true;
        ytContainer.hidden = false;
        
        playerWrapper.classList.remove('audio-mode');
        playerWrapper.classList.add('video-mode');

        if (ytPlayer) {
          ytPlayer.destroy();
        }

        // Create the new YouTube Player
        ytPlayer = new YT.Player('youtubeContainer', {
          height: '100%',
          width: '100%',
          videoId: videoId,
          playerVars: {
            'rel': 0,
            'autoplay': 1
          },
          events: {
            'onError': onPlayerError
          }
        });
      }

      function showVideo() {
        defaultMsg.hidden = true;
        audioPlayer.hidden = true;
        ytContainer.hidden = true;
        videoPlayer.hidden = false;
        playerWrapper.classList.remove('audio-mode');
        playerWrapper.classList.add('video-mode');
      }

      function showAudio() {
        defaultMsg.hidden = true;
        videoPlayer.hidden = true;
        ytContainer.hidden = true;
        audioPlayer.hidden = false;
        playerWrapper.classList.remove('video-mode');
        playerWrapper.classList.add('audio-mode');
      }

      function guessDirectType(url) {
        const path = url.split('?')[0].split('#')[0].toLowerCase();
        const audioExts = ['.mp3', '.wav', '.m4a', '.aac', '.flac', '.opus', '.oga'];
        if (audioExts.some(ext => path.endsWith(ext))) return 'audio';
        return 'video';
      }

      function loadFromInput() {
        const url = urlInput.value.trim();
        if (!url) {
          resetPlayer('⚠️ Please enter a URL');
          return;
        }

        // 1. Handle YouTube
        const ytId = getYouTubeId(url);
        if (ytId) {
          sourceLabel.textContent = '📡 YouTube: ' + ytId;
          // Make sure the API is loaded before trying to create the player
          if (window.YT && window.YT.Player) {
            playYouTube(ytId);
          } else {
            // If API isn't loaded yet, wait a moment and try again
            setTimeout(() => {
              if (window.YT && window.YT.Player) playYouTube(ytId);
              else resetPlayer('⚠️ Failed to load YouTube API. Please refresh.');
            }, 1000);
          }
          return;
        }

        // 2. Handle Direct Files (using Proxy)
        let parsed;
        try {
          parsed = new URL(url.startsWith('//') ? 'https:' + url : url);
        } catch (e) {
          resetPlayer('❌ Invalid URL format');
          return;
        }

        if (!['http:', 'https:', 'blob:', 'data:'].includes(parsed.protocol)) {
          resetPlayer('⛔ Unsupported URL scheme');
          return;
        }

        const type = guessDirectType(url);
        sourceLabel.textContent = '📡 Proxied: ' + (url.length > 60 ? url.slice(0, 57) + '…' : url);

        // Route through the Vercel proxy to bypass CORS
        const proxyUrl = `/api/proxy?url=${encodeURIComponent(url)}`;

        if (type === 'audio') {
          showAudio();
          audioPlayer.src = proxyUrl;
          audioPlayer.load();
          const p = audioPlayer.play();
          if (p) p.catch(err => console.warn('Autoplay blocked:', err));
        } else {
          showVideo();
          videoPlayer.src = proxyUrl;
          videoPlayer.load();
          const p = videoPlayer.play();
          if (p) p.catch(err => console.warn('Autoplay blocked:', err));
        }
      }

      loadBtn.addEventListener('click', loadFromInput);
      urlInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') { e.preventDefault(); loadFromInput(); }
      });

      clearBtn.addEventListener('click', () => {
        urlInput.value = '';
        urlInput.focus();
        resetPlayer();
      });

      resetPlayer();
    })();
  </script>
</body>
</html>
