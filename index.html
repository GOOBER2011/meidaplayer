<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTube - Library</title>
  
  <style>
    /* --- CSS VARIABLES (YouTube Theme) --- */
    :root {
      --bg-base: #0f0f0f;
      --bg-elevated: #212121;
      --bg-hover: #3f3f3f;
      --text-primary: #f1f1f1;
      --text-secondary: #aaaaaa;
      --accent-blue: #3ea6ff;
      --border-color: #303030;
      --error-red: #ff4444;
    }

    /* --- RESET & GLOBAL --- */
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: Roboto, Arial, sans-serif; }
    body { background-color: var(--bg-base); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }

    /* --- SIDEBAR --- */
    .sidebar { width: 240px; background-color: var(--bg-base); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; }
    .sidebar-header { display: flex; align-items: center; padding: 1rem 1.5rem; font-size: 1.2rem; font-weight: bold; color: white; border-bottom: 1px solid var(--border-color); gap: 0.5rem; }
    .sidebar-header .yt-logo { color: #ff0000; font-size: 1.5rem; }
    .nav-item { padding: 0.75rem 1.5rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; color: var(--text-primary); transition: background 0.15s; font-size: 0.95rem; font-weight: 500; }
    .nav-item:hover { background-color: var(--bg-hover); }
    .nav-item.active { background-color: var(--bg-elevated); border-left: 3px solid var(--accent-blue); }

    /* --- MAIN CONTENT AREA --- */
    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 1.5rem 2rem; }
    .section-title { font-size: 1.2rem; margin-bottom: 1rem; font-weight: 500; }

    /* --- ADD VIDEO INPUT BOX --- */
    .add-video-box { background: var(--bg-elevated); padding: 1.5rem; border-radius: 12px; margin-bottom: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; border: 1px solid var(--border-color); }
    .url-input { flex: 1 1 300px; background: var(--bg-base); border: 1px solid var(--border-color); border-radius: 8px; padding: 0 1rem; height: 3rem; font-size: 1rem; color: white; outline: none; transition: border 0.2s; }
    .url-input:focus { border-color: var(--accent-blue); }
    .add-btn { background: var(--accent-blue); border: none; border-radius: 8px; padding: 0 1.5rem; height: 3rem; font-size: 1rem; font-weight: bold; color: #0f0f0f; cursor: pointer; transition: opacity 0.2s; }
    .add-btn:hover { opacity: 0.9; }
    .add-btn:disabled { background: #444; color: #888; cursor: not-allowed; }

    /* --- PLAYER WRAPPER --- */
    .player-container { width: 100%; max-width: 900px; aspect-ratio: 16 / 9; background: black; border-radius: 12px; overflow: hidden; margin-bottom: 2rem; position: relative; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); }
    #youtubeContainer, iframe { width: 100%; height: 100%; border: 0; position: absolute; top: 0; left: 0; }
    .error-message { color: var(--text-secondary); text-align: center; padding: 2rem; font-size: 1.1rem; line-height: 1.5; font-weight: 500; }

    /* --- VIDEO GRID --- */
    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 1.5rem; }
    .video-card { cursor: pointer; background: transparent; border-radius: 12px; transition: transform 0.1s; position: relative; display: flex; flex-direction: column; }
    .video-card:hover { transform: scale(1.02); }
    .thumbnail-container { width: 100%; aspect-ratio: 16 / 9; border-radius: 8px; overflow: hidden; background: #222; position: relative; }
    .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; }
    .delete-btn { position: absolute; top: 8px; right: 8px; background: rgba(0,0,0,0.8); color: white; border: none; border-radius: 50%; width: 32px; height: 32px; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 1.2rem; opacity: 0; transition: opacity 0.2s, background 0.2s; z-index: 10; }
    .video-card:hover .delete-btn { opacity: 1; }
    .delete-btn:hover { background: var(--error-red); }
    .video-info { display: flex; gap: 12px; margin-top: 12px; }
    .channel-avatar { width: 36px; height: 36px; border-radius: 50%; background: var(--bg-elevated); display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--accent-blue); flex-shrink: 0; }
    .video-text { display: flex; flex-direction: column; overflow: hidden; }
    .video-title { font-size: 1rem; font-weight: 500; color: var(--text-primary); margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    .video-author { font-size: 0.85rem; color: var(--text-secondary); }
    .empty-state { color: var(--text-secondary); font-size: 1rem; grid-column: 1 / -1; text-align: center; padding: 3rem; }

    /* --- UTILITIES --- */
    [hidden] { display: none !important; }
  </style>
</head>
<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="yt-logo">▶</span> MyTube
    </div>
    <div class="nav-item active" id="navMyVideos">
      📁 My Videos
    </div>
    <div class="nav-item" id="navPublicVideos">
      🌐 Public Videos
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    
    <!-- MY VIDEOS SECTION -->
    <div id="myVideosSection">
      <div class="section-title">Add a new video to your library</div>
      
      <div class="add-video-box">
        <input type="url" id="urlInput" class="url-input" placeholder="Paste a YouTube link to save..." spellcheck="false" />
        <button id="addBtn" class="add-btn">Save Video</button>
      </div>

      <!-- Player Area -->
      <div class="player-container" id="playerContainer">
        <div id="defaultMsg" class="error-message">Select a video below or add a new one to start watching.</div>
        <div id="youtubeContainer" hidden></div>
      </div>

      <!-- Video Grid -->
      <div class="section-title">Your Library</div>
      <div class="video-grid" id="myVideoGrid"></div>
    </div>

    <!-- PUBLIC VIDEOS SECTION (Placeholder) -->
    <div id="publicVideosSection" hidden>
      <div class="section-title">Public Videos</div>
      <div class="empty-state">We will build the public videos section later!</div>
    </div>

  </div>

  <!-- JAVASCRIPT LOGIC -->
  <script>
    // --- STATE & STORAGE ---
    let myVideos = JSON.parse(localStorage.getItem('myTubeVideos')) || [];
    let ytPlayer = null;
    let currentYtId = null;

    // --- DOM ELEMENTS ---
    const urlInput = document.getElementById('urlInput');
    const addBtn = document.getElementById('addBtn');
    const myVideoGrid = document.getElementById('myVideoGrid');
    const ytContainer = document.getElementById('youtubeContainer');
    const defaultMsg = document.getElementById('defaultMsg');
    const myVideosSection = document.getElementById('myVideosSection');
    const publicVideosSection = document.getElementById('publicVideosSection');
    const navMyVideos = document.getElementById('navMyVideos');
    const navPublicVideos = document.getElementById('navPublicVideos');

    // --- TAB SWITCHING ---
    navMyVideos.addEventListener('click', () => {
      myVideosSection.hidden = false;
      publicVideosSection.hidden = true;
      navMyVideos.classList.add('active');
      navPublicVideos.classList.remove('active');
    });

    navPublicVideos.addEventListener('click', () => {
      myVideosSection.hidden = true;
      publicVideosSection.hidden = false;
      navPublicVideos.classList.add('active');
      navMyVideos.classList.remove('active');
    });

    // --- YOUTUBE HELPERS ---
    function getYouTubeId(url) {
      try {
        const parsed = new URL(url);
        const host = parsed.hostname.replace('www.', '');
        if (host === 'youtube.com' || host === 'm.youtube.com') return parsed.searchParams.get('v');
        if (host === 'youtu.be') return parsed.pathname.slice(1).split('?')[0];
      } catch (e) { return null; }
      return null;
    }

    function onPlayerError(event) {
      let errorMessage = '⚠️ An error occurred while trying to play this video.';
      if (event.data === 101 || event.data === 150) {
        errorMessage = '⛔ This video is not allowed to be played by the creator. There is nothing I can do about this restriction.';
      } else if (event.data === 153) {
        errorMessage = '⚠️ Configuration error (153). Ensure you are on a valid domain.';
      }
      ytContainer.hidden = true;
      defaultMsg.hidden = false;
      defaultMsg.innerText = errorMessage;
    }

    function playVideo(videoId) {
      if (currentYtId === videoId && ytPlayer) return;
      currentYtId = videoId;

      defaultMsg.hidden = true;
      ytContainer.hidden = false;

      if (window.YT && window.YT.Player) {
        if (ytPlayer) {
          ytPlayer.loadVideoById(videoId);
        } else {
          ytPlayer = new YT.Player('youtubeContainer', {
            height: '100%',
            width: '100%',
            videoId: videoId,
            playerVars: { 'rel': 0, 'autoplay': 1 },
            events: { 'onError': onPlayerError }
          });
        }
      } else {
        // If YouTube API isn't loaded yet, wait and try again
        setTimeout(() => playVideo(videoId), 500);
      }
    }

    // --- RENDER UI ---
    function renderVideos() {
      myVideoGrid.innerHTML = '';
      
      if (myVideos.length === 0) {
        myVideoGrid.innerHTML = '<div class="empty-state">Your library is empty. Paste a link above to save a video!</div>';
        return;
      }

      myVideos.forEach((video, index) => {
        const card = document.createElement('div');
        card.className = 'video-card';
        
        card.innerHTML = `
          <div class="thumbnail-container">
            <img src="${video.thumbnail}" alt="Thumbnail" loading="lazy" />
            <button class="delete-btn" title="Remove from library">×</button>
          </div>
          <div class="video-info">
            <div class="channel-avatar">${video.author.charAt(0).toUpperCase()}</div>
            <div class="video-text">
              <div class="video-title">${video.title}</div>
              <div class="video-author">${video.author}</div>
            </div>
          </div>
        `;

        card.addEventListener('click', (e) => {
          if (e.target.classList.contains('delete-btn')) return;
          playVideo(video.id);
          window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        const deleteBtn = card.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          myVideos.splice(index, 1);
          localStorage.setItem('myTubeVideos', JSON.stringify(myVideos));
          renderVideos();
        });

        myVideoGrid.appendChild(card);
      });
    }

    // --- ADD VIDEO LOGIC ---
    addBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) return;

      const ytId = getYouTubeId(url);
      if (!ytId) {
        alert('Please enter a valid YouTube link.');
        return;
      }

      if (myVideos.some(v => v.id === ytId)) {
        alert('Video is already in your library!');
        return;
      }

      addBtn.innerText = 'Fetching...';
      addBtn.disabled = true;

      try {
        const response = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${ytId}`);
        const data = await response.json();

        if (data.error) throw new Error('Could not fetch video data.');

        const newVideo = {
          id: ytId,
          title: data.title || 'Unknown Title',
          author: data.author_name || 'Unknown Creator',
          thumbnail: data.thumbnail_url || `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`
        };

        myVideos.unshift(newVideo);
        localStorage.setItem('myTubeVideos', JSON.stringify(myVideos));
        
        urlInput.value = '';
        renderVideos();

      } catch (err) {
        console.error(err);
        alert('Failed to fetch video details. The video might be private or age-restricted.');
      } finally {
        addBtn.innerText = 'Save Video';
        addBtn.disabled = false;
      }
    });

    // Support pressing Enter in the input field
    urlInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') addBtn.click();
    });

    // --- INITIALIZATION ---
    // Load the YouTube API dynamically
    if (!window.YT) {
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    // Render the saved videos when page loads
    renderVideos();
  </script>
</body>
</html>
