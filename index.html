<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TubeYou</title>
  
  <!-- Supabase Client Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    :root {
      --bg-base: #030509;
      --bg-surface: rgba(10, 15, 25, 0.85);
      --bg-elevated: #0c1322;
      --bg-hover: #15223b;
      --text-primary: #ffffff;
      --text-secondary: #8899bb;
      --accent: #0066ff;
      --accent-hover: #3388ff;
      --border-color: rgba(26, 42, 74, 0.6);
      --danger: #ff3333;
      --sidebar-width: 260px;
      --sidebar-collapsed: 80px;
      --transition: 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    @keyframes auroraMove {
      0% { transform: translate(-10%, -10%) scale(1); }
      50% { transform: translate(10%, 10%) scale(1.2); }
      100% { transform: translate(-10%, -10%) scale(1); }
    }
    .aurora-bg { position: fixed; top: 0; left: 0; right: 0; bottom: 0; z-index: -1; background-color: var(--bg-base); overflow: hidden; transition: opacity 0.5s ease; }
    .aurora-bg.disabled { opacity: 0; }
    .aurora-blob { position: absolute; width: 60vw; height: 60vw; background: radial-gradient(circle, rgba(0,102,255,0.12) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; filter: blur(60px); animation: auroraMove 15s infinite alternate ease-in-out; }
    .aurora-blob:nth-child(2) { top: 20%; left: 50%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(0,51,153,0.15) 0%, rgba(0,0,0,0) 70%); animation-duration: 20s; animation-direction: alternate-reverse; }
    .aurora-blob:nth-child(3) { top: 60%; left: 10%; width: 70vw; height: 70vw; background: radial-gradient(circle, rgba(0,170,255,0.08) 0%, rgba(0,0,0,0) 70%); animation-duration: 25s; animation-delay: -5s; }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    body { background-color: var(--bg-base); color: var(--text-primary); display: flex; height: 100vh; overflow: hidden; }
    svg { fill: currentColor; display: block; }
    [hidden] { display: none !important; }
    button { font-family: inherit; cursor: pointer; border: none; outline: none; }
    ::-webkit-scrollbar { width: 8px; height: 8px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--border-color); border-radius: 4px; }

    .sidebar { width: var(--sidebar-width); background-color: var(--bg-surface); backdrop-filter: blur(20px); border-right: 1px solid var(--border-color); display: flex; flex-direction: column; flex-shrink: 0; transition: width var(--transition); overflow: hidden; z-index: 20; }
    .sidebar.collapsed { width: var(--sidebar-collapsed); }
    .sidebar-header { display: flex; align-items: center; padding: 1.5rem; font-size: 1.4rem; font-weight: 800; border-bottom: 1px solid var(--border-color); cursor: pointer; white-space: nowrap; }
    .sidebar.collapsed .sidebar-header { justify-content: center; padding: 1.5rem 0; }
    .sidebar.collapsed .nav-text { display: none; }
    .logo-icon { color: var(--accent); margin-right: 12px; width: 28px; height: 28px; flex-shrink: 0; }
    .sidebar.collapsed .logo-icon { margin-right: 0; }
    .nav-section { padding: 1rem 0; display: flex; flex-direction: column; gap: 4px; }
    .nav-item { padding: 0.8rem 1.5rem; display: flex; align-items: center; gap: 1.2rem; cursor: pointer; color: var(--text-secondary); transition: all var(--transition); font-size: 0.95rem; font-weight: 600; border-left: 3px solid transparent; white-space: nowrap; }
    .sidebar.collapsed .nav-item { justify-content: center; padding: 0.8rem 0; border-left: none; border-radius: 8px; margin: 0 10px; }
    .nav-item svg { width: 22px; height: 22px; flex-shrink: 0; }
    .nav-item:hover { background-color: var(--bg-hover); color: var(--text-primary); }
    .nav-item.active { background-color: var(--bg-elevated); color: var(--accent); border-left: 3px solid var(--accent); }

    .main-content { flex: 1; display: flex; flex-direction: column; overflow-y: auto; padding: 2rem 3rem; position: relative; }
    .view-header { display: flex; justify-content: space-between; align-items: flex-end; margin-bottom: 2rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color); }
    .section-title { font-size: 1.6rem; font-weight: 700; letter-spacing: -0.5px; }
    .section-subtitle { font-size: 0.9rem; color: var(--text-secondary); margin-top: 4px; }

    .add-video-box { background: var(--bg-surface); backdrop-filter: blur(10px); padding: 1rem; border-radius: 12px; margin-bottom: 2rem; display: flex; gap: 1rem; flex-wrap: wrap; border: 1px solid var(--border-color); }
    .input-wrapper { flex: 1 1 300px; position: relative; display: flex; align-items: center; }
    .input-icon { position: absolute; left: 1rem; color: var(--text-secondary); width: 20px; height: 20px; }
    .url-input { width: 100%; background: var(--bg-base); border: 1px solid var(--border-color); border-radius: 8px; padding: 0 1rem 0 3rem; height: 3rem; font-size: 0.95rem; color: white; outline: none; }
    .url-input:focus { border-color: var(--accent); }
    .btn { background: var(--accent); border-radius: 8px; padding: 0 1.5rem; height: 3rem; font-size: 0.95rem; font-weight: 600; color: white; transition: background var(--transition); display: flex; align-items: center; justify-content: center; gap: 0.5rem; }
    .btn:hover { background: var(--accent-hover); }
    .btn:disabled { background: #333; color: #666; cursor: not-allowed; }

    .player-container { width: 100%; max-width: 1100px; aspect-ratio: 16 / 9; background: #000; border-radius: 16px; overflow: hidden; margin-bottom: 2rem; position: relative; display: flex; align-items: center; justify-content: center; border: 1px solid var(--border-color); }
    .player-container iframe { width: 100%; height: 100%; border: 0; position: absolute; top: 0; left: 0; }
    .error-message { color: var(--text-secondary); text-align: center; padding: 2rem; font-size: 1.1rem; display: flex; flex-direction: column; align-items: center; gap: 1rem; }
    .error-message svg { width: 48px; height: 48px; color: var(--accent); }

    .public-player-section { display: flex; gap: 2rem; margin-bottom: 2rem; flex-wrap: wrap; }
    .public-player-main { flex: 1 1 600px; }
    .public-player-sidebar { flex: 1 1 300px; background: var(--bg-surface); border: 1px solid var(--border-color); border-radius: 12px; padding: 1.5rem; max-height: 500px; display: flex; flex-direction: column; }
    .public-video-title { font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; }
    .public-video-meta { display: flex; justify-content: space-between; align-items: center; color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 1.5rem; padding-bottom: 1rem; border-bottom: 1px solid var(--border-color); }
    
    .like-btn { display: flex; align-items: center; gap: 6px; background: var(--bg-base); border: 1px solid var(--border-color); padding: 0.5rem 1rem; border-radius: 20px; color: white; font-weight: 600; transition: all 0.2s; }
    .like-btn:hover { background: var(--bg-hover); }
    .like-btn.liked { color: var(--accent); border-color: var(--accent); background: rgba(0,102,255,0.1); }
    .like-btn svg { width: 18px; height: 18px; }

    .comments-section h3 { font-size: 1.1rem; margin-bottom: 1rem; }
    .comment-input-wrapper { display: flex; gap: 10px; margin-bottom: 1.5rem; }
    .comment-input { flex: 1; background: var(--bg-base); border: 1px solid var(--border-color); border-radius: 8px; padding: 0.8rem; color: white; outline: none; }
    .comment-input:focus { border-color: var(--accent); }
    .comment-list { flex: 1; overflow-y: auto; display: flex; flex-direction: column; gap: 1rem; padding-right: 5px; }
    .comment { display: flex; gap: 10px; }
    .comment-avatar { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); color: white; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 0.9rem; flex-shrink: 0; }
    .comment-content { background: var(--bg-base); padding: 0.8rem; border-radius: 8px; flex: 1; }
    .comment-author { font-size: 0.85rem; font-weight: 600; color: var(--accent); margin-bottom: 4px; }
    .comment-text { font-size: 0.9rem; color: var(--text-primary); line-height: 1.4; word-break: break-word; }

    .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 1.5rem; }
    .video-card { background: var(--bg-surface); border-radius: 12px; transition: transform var(--transition), border-color var(--transition); position: relative; display: flex; flex-direction: column; border: 1px solid transparent; overflow: hidden; }
    .video-card:hover { transform: translateY(-4px); border-color: var(--border-color); }
    .thumbnail-container { width: 100%; aspect-ratio: 16 / 9; background: #000; position: relative; cursor: pointer; }
    .thumbnail-container img { width: 100%; height: 100%; object-fit: cover; transition: transform var(--transition); }
    .video-card:hover .thumbnail-container img { transform: scale(1.05); }
    .video-info { display: flex; gap: 12px; padding: 1rem; }
    .channel-avatar { width: 38px; height: 38px; border-radius: 50%; background: var(--bg-elevated); object-fit: cover; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-weight: bold; color: var(--accent); }
    .video-text { display: flex; flex-direction: column; overflow: hidden; }
    .video-title { font-size: 0.95rem; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.4; cursor: pointer; }
    .video-author { font-size: 0.85rem; color: var(--text-secondary); }
    .empty-state { color: var(--text-secondary); font-size: 1rem; grid-column: 1 / -1; text-align: center; padding: 4rem; background: var(--bg-surface); border-radius: 12px; border: 1px dashed var(--border-color); }

    .loader { border: 3px solid var(--border-color); border-top: 3px solid var(--accent); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 2rem auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="aurora-bg" id="auroraBg">
    <div class="aurora-blob"></div><div class="aurora-blob"></div><div class="aurora-blob"></div>
  </div>

  <div class="sidebar" id="sidebar">
    <div class="sidebar-header" id="sidebarToggle">
      <svg class="logo-icon" viewBox="0 0 24 24"><path d="M21.582 6.186a2.6 2.6 0 0 0-1.836-1.844C18.09 3.9 12 3.9 12 3.9s-6.09 0-7.746.442a2.6 2.6 0 0 0-1.836 1.844C2 7.863 2 12 2 12s0 4.137.418 5.814a2.6 2.6 0 0 0 1.836 1.844C5.91 20.1 12 20.1 12 20.1s6.09 0 7.746-.442a2.6 2.6 0 0 0 1.836-1.844C22 16.137 22 12 22 12s0-4.137-.418-5.814zM9.9 15.3V8.7l5.8 3.3-5.8 3.3z"/></svg>
      <span class="nav-text">TubeYou</span>
    </div>
    <div class="nav-section">
      <div class="nav-item active" data-view="library">
        <svg viewBox="0 0 24 24"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/></svg>
        <span class="nav-text">Library</span>
      </div>
      <div class="nav-item" data-view="public">
        <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/></svg>
        <span class="nav-text">Public Feed</span>
      </div>
    </div>
  </div>

  <div class="main-content">
    <div id="libraryView">
      <div class="view-header">
        <div>
          <h1 class="section-title">Your Library</h1>
          <p class="section-subtitle">Save videos locally and publish them to the world</p>
        </div>
      </div>
      <div class="add-video-box">
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24"><path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/></svg>
          <input type="url" id="urlInput" class="url-input" placeholder="Paste a YouTube link to save privately..." spellcheck="false" />
        </div>
        <button id="addBtn" class="btn">
          <svg viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg>
          Save Video
        </button>
      </div>
      <div class="player-container" id="privatePlayerContainer">
        <div id="privateDefaultMsg" class="error-message">
          <svg viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
          <span>Select a video to start watching.</span>
        </div>
        <div id="privateYoutubeContainer" hidden></div>
      </div>
      <div class="view-header" style="margin-top: 1rem; margin-bottom: 1rem;">
        <h2 class="section-title" style="font-size:1.3rem;">All Private Videos</h2>
      </div>
      <div class="video-grid" id="myVideoGrid"></div>
    </div>

    <div id="publicView" hidden>
      <div class="view-header">
        <div>
          <h1 class="section-title">Public Feed</h1>
          <p class="section-subtitle">Watch videos published by everyone</p>
        </div>
      </div>
      
      <div id="publicSelectedArea" hidden>
        <div class="public-player-section">
          <div class="public-player-main">
            <div class="player-container" style="margin-bottom: 1rem;">
              <div id="publicYoutubeContainer"></div>
            </div>
            <h2 class="public-video-title" id="pubTitle"></h2>
            <div class="public-video-meta">
              <div class="flex items-center gap-2" style="display:flex; align-items:center; gap:10px;">
                <img id="pubAuthorAvatar" src="" style="width:32px;height:32px;border-radius:50%;object-fit:cover;" />
                <span id="pubAuthorName" style="font-weight:600; color:white;"></span>
                <span style="margin-left: 10px; font-size:0.85rem;">👁️ <span id="pubViews">0</span> views</span>
              </div>
              <button class="like-btn" id="pubLikeBtn">
                <svg viewBox="0 0 24 24"><path d="M1 21h4V9H1v12zm22-11c0-1.1-.9-2-2-2h-6.31l.95-4.57.03-.32c0-.41-.17-.79-.44-1.06L14.17 1 7.59 7.59C7.22 7.95 7 8.45 7 9v10c0 1.1.9 2 2 2h9c.83 0 1.54-.5 1.84-1.22l3.02-7.05c.09-.23.14-.47.14-.73v-2z"/></svg>
                <span id="pubLikeCount">0</span>
              </button>
            </div>
          </div>
          
          <div class="public-player-sidebar">
            <div class="comments-section">
              <h3>Comments</h3>
              <div class="comment-input-wrapper">
                <input type="text" id="pubCommentInput" class="comment-input" placeholder="Add a public comment..." />
                <button class="btn" id="pubCommentBtn" style="height: auto; padding: 0 1rem;">Post</button>
              </div>
              <div class="comment-list" id="pubCommentList"></div>
            </div>
          </div>
        </div>
      </div>

      <div class="video-grid" id="publicVideoGrid"></div>
    </div>
  </div>

  <script>
    // ==========================================
    // SUPABASE CONFIGURATION
    // ==========================================
    const SUPABASE_URL = 'https://yudpsvfjqeiffsahhutf.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_kDGmA7Bcq4VCHrnOT2vtLg_bUpV5IZH';
    
    const { createClient } = supabase;
    const db = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
    
    // Generate a unique Session ID for Likes
    let sessionId = localStorage.getItem('tubeYouSessionId');
    if (!sessionId) {
      sessionId = crypto.randomUUID();
      localStorage.setItem('tubeYouSessionId', sessionId);
    }

    // Ask for username on first visit, save to localStorage
    let username = localStorage.getItem('tubeYouUsername');
    if (!username) {
      username = prompt("Welcome to TubeYou! Please enter a display name for commenting and posting:", "Guest User");
      if (!username || username.trim() === '') username = "Anonymous";
      localStorage.setItem('tubeYouUsername', username);
    }

    // ==========================================
    // STATE & VARIABLES
    // ==========================================
    let localVideos = JSON.parse(localStorage.getItem('tubeYouVideos')) || [];
    let publicVideos = [];
    let currentPublicVideoId = null;
    let currentPublicVideoData = null;
    
    let ytPlayerPrivate = null;
    let ytPlayerPublic = null;

    const urlInput = document.getElementById('urlInput');
    const addBtn = document.getElementById('addBtn');
    const myVideoGrid = document.getElementById('myVideoGrid');
    const publicVideoGrid = document.getElementById('publicVideoGrid');
    const privateYtContainer = document.getElementById('privateYoutubeContainer');
    const privateDefaultMsg = document.getElementById('privateDefaultMsg');
    const libraryView = document.getElementById('libraryView');
    const publicView = document.getElementById('publicView');
    const publicSelectedArea = document.getElementById('publicSelectedArea');

    // ==========================================
    // YOUTUBE METADATA
    // ==========================================
    function getYouTubeId(url) {
      try {
        const parsed = new URL(url);
        const host = parsed.hostname.replace('www.', '');
        if (host === 'youtube.com' || host === 'm.youtube.com') return parsed.searchParams.get('v');
        if (host === 'youtu.be') return parsed.pathname.slice(1).split('?')[0];
      } catch (e) { return null; }
      return null;
    }

    async function fetchVideoMetadata(ytId) {
      const noembedRes = await fetch(`https://noembed.com/embed?url=https://www.youtube.com/watch?v=${ytId}`);
      const noembedData = await noembedRes.json();
      if (noembedData.error) throw new Error('Video unavailable');
      let authorAvatar = `https://ui-avatars.com/api/?name=${encodeURIComponent(noembedData.author_name)}&background=0c1322&color=0066ff&bold=true`;
      try {
        if (noembedData.author_url) {
           const channelId = noembedData.author_url.split('/channel/')[1];
           if (channelId) authorAvatar = `https://unavatar.io/youtube/${channelId}`;
        }
      } catch (e) {}
      return {
        youtube_id: ytId, 
        title: noembedData.title, 
        author: noembedData.author_name,
        thumbnail: noembedData.thumbnail_url || `https://img.youtube.com/vi/${ytId}/hqdefault.jpg`,
        avatar: authorAvatar
      };
    }

    // ==========================================
    // PLAYERS
    // ==========================================
    function onPlayerError(event) {
      alert('This video is not allowed to be played by the creator.');
    }

    function playPrivateVideo(videoId) {
      privateDefaultMsg.hidden = true;
      privateYtContainer.hidden = false;
      if (window.YT && window.YT.Player) {
        if (ytPlayerPrivate) ytPlayerPrivate.loadVideoById(videoId);
        else ytPlayerPrivate = new YT.Player('privateYoutubeContainer', {
          height: '100%', width: '100%', videoId: videoId, playerVars: { 'rel': 0, 'autoplay': 1 }, events: { 'onError': onPlayerError }
        });
      } else setTimeout(() => playPrivateVideo(videoId), 500);
    }

    async function playPublicVideo(video) {
      currentPublicVideoId = video.id;
      currentPublicVideoData = video;
      publicSelectedArea.hidden = false;
      window.scrollTo({ top: 0, behavior: 'smooth' });

      document.getElementById('pubTitle').innerText = video.title;
      document.getElementById('pubAuthorName').innerText = video.author;
      document.getElementById('pubAuthorAvatar').src = video.avatar;
      document.getElementById('pubViews').innerText = video.views;
      document.getElementById('pubLikeCount').innerText = '...';
      document.getElementById('pubCommentList').innerHTML = '<div class="loader"></div>';

      if (window.YT && window.YT.Player) {
        if (ytPlayerPublic) ytPlayerPublic.loadVideoById(video.youtube_id);
        else ytPlayerPublic = new YT.Player('publicYoutubeContainer', {
          height: '100%', width: '100%', videoId: video.youtube_id, playerVars: { 'rel': 0, 'autoplay': 1 }, events: { 'onError': onPlayerError }
        });
      } else setTimeout(() => playPublicVideo(video), 500);

      // Increment view count
      await db.rpc('increment_views', { v_id: video.id });
      document.getElementById('pubViews').innerText = video.views + 1;

      // Load Comments and Likes
      loadPublicInteractions(video.id);
    }

    // ==========================================
    // SUPABASE INTERACTIONS
    // ==========================================
    async function loadPublicVideos() {
      publicVideoGrid.innerHTML = '<div class="loader"></div>';
      const { data, error } = await db.from('videos').select('*').order('created_at', { ascending: false });
      
      if (error) {
        publicVideoGrid.innerHTML = '<div class="empty-state">Failed to load public videos.</div>';
        return;
      }
      
      publicVideos = data;
      publicVideoGrid.innerHTML = '';
      
      if (publicVideos.length === 0) {
        publicVideoGrid.innerHTML = '<div class="empty-state">No public videos yet. Publish one from your library!</div>';
        return;
      }
      publicVideos.forEach(video => publicVideoGrid.appendChild(createPublicCard(video)));
    }

    async function loadPublicInteractions(videoId) {
      // 1. Fetch Likes
      const { data: likes } = await db.from('likes').select('*').eq('video_id', videoId);
      const likeCount = likes ? likes.length : 0;
      const hasLiked = likes ? likes.some(l => l.session_id === sessionId) : false;
      
      document.getElementById('pubLikeCount').innerText = likeCount;
      document.getElementById('pubLikeBtn').classList.toggle('liked', hasLiked);

      // 2. Fetch Comments
      const { data: comments } = await db.from('comments').select('*').eq('video_id', videoId).order('created_at', { ascending: false });
      const commentList = document.getElementById('pubCommentList');
      commentList.innerHTML = '';

      if (!comments || comments.length === 0) {
        commentList.innerHTML = '<div style="color:var(--text-secondary); text-align:center; margin-top:1rem;">No comments yet. Be the first!</div>';
        return;
      }
      
      comments.forEach(c => {
        commentList.innerHTML += `
          <div class="comment">
            <div class="comment-avatar">${c.author.charAt(0).toUpperCase()}</div>
            <div class="comment-content">
              <div class="comment-author">${c.author}</div>
              <div class="comment-text">${c.text}</div>
            </div>
          </div>
        `;
      });
    }

    // ==========================================
    // EVENT LISTENERS
    // ==========================================
    
    // Like Button
    document.getElementById('pubLikeBtn').onclick = async () => {
      if (!currentPublicVideoId) return;
      
      const isLiked = document.getElementById('pubLikeBtn').classList.contains('liked');
      
      if (isLiked) {
        await db.from('likes').delete().eq('video_id', currentPublicVideoId).eq('session_id', sessionId);
      } else {
        await db.from('likes').insert({ video_id: currentPublicVideoId, session_id: sessionId });
      }
      loadPublicInteractions(currentPublicVideoId);
    };

    // Post Comment
    document.getElementById('pubCommentBtn').onclick = async () => {
      const input = document.getElementById('pubCommentInput');
      const text = input.value.trim();
      if (!text || !currentPublicVideoId) return;

      await db.from('comments').insert({
        video_id: currentPublicVideoId,
        author: username,
        text: text
      });
      
      input.value = '';
      loadPublicInteractions(currentPublicVideoId);
    };

    // Render Cards
    function createLocalCard(video) {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.innerHTML = `
        <div class="thumbnail-container">
          <img src="${video.thumbnail}" alt="Thumbnail" loading="lazy" />
        </div>
        <div class="video-info">
          <img src="${video.avatar}" class="channel-avatar" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(video.author)}&background=0c1322&color=0066ff'" />
          <div class="video-text">
            <div class="video-title">${video.title}</div>
            <div class="video-author">${video.author}</div>
          </div>
        </div>
      `;
      card.onclick = () => {
        playPrivateVideo(video.youtube_id);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      };
      return card;
    }

    function createPublicCard(video) {
      const card = document.createElement('div');
      card.className = 'video-card';
      card.innerHTML = `
        <div class="thumbnail-container">
          <img src="${video.thumbnail}" alt="Thumbnail" loading="lazy" />
        </div>
        <div class="video-info">
          <img src="${video.avatar}" class="channel-avatar" onerror="this.src='https://ui-avatars.com/api/?name=${encodeURIComponent(video.author)}&background=0c1322&color=0066ff'" />
          <div class="video-text">
            <div class="video-title">${video.title}</div>
            <div class="video-author">${video.author} • ${video.views} views</div>
          </div>
        </div>
      `;
      card.onclick = () => playPublicVideo(video);
      return card;
    }

    // Add Video (Local + Supabase)
    addBtn.addEventListener('click', async () => {
      const url = urlInput.value.trim();
      if (!url) return;
      const ytId = getYouTubeId(url);
      if (!ytId) return alert('Invalid YouTube link');
      
      addBtn.disabled = true;
      addBtn.innerText = 'Fetching...';
      try {
        const newVideo = await fetchVideoMetadata(ytId);
        
        // Check if it exists locally
        if (localVideos.some(v => v.youtube_id === ytId)) {
           alert('Already saved locally!');
        } else {
           localVideos.unshift(newVideo);
           localStorage.setItem('tubeYouVideos', JSON.stringify(localVideos));
           renderLocalVideos();
        }
        
        urlInput.value = '';
      } catch (err) { 
        alert('Failed to fetch video. It may be private or restricted.'); 
      } finally {
        addBtn.disabled = false;
        addBtn.innerHTML = `<svg viewBox="0 0 24 24" style="width:20px;height:20px;"><path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/></svg> Save Video`;
      }
    });

    // Render Local Videos
    function renderLocalVideos() {
      myVideoGrid.innerHTML = '';
      if (localVideos.length === 0) {
        myVideoGrid.innerHTML = '<div class="empty-state">No videos here yet. Add some above!</div>';
        return;
      }
      localVideos.forEach(video => myVideoGrid.appendChild(createLocalCard(video)));
    }

    // Publish to Public Feed
    async function publishVideo(video) {
      const { data: existing } = await db.from('videos').select('id').eq('youtube_id', video.youtube_id);
      if (existing && existing.length > 0) {
        return alert('This video is already public!');
      }

      const { error } = await db.from('videos').insert({
        youtube_id: video.youtube_id,
        title: video.title,
        author: video.author,
        thumbnail: video.thumbnail,
        avatar: video.avatar
      });

      if (error) {
        console.error(error);
        alert('Failed to publish video.');
      } else {
        alert('Successfully published to the Public Feed!');
        loadPublicVideos(); // Refresh public feed
      }
    }

    // Add Publish Button to Local Cards
    const originalCreateLocalCard = createLocalCard;
    createLocalCard = function(video) {
      const card = originalCreateLocalCard(video);
      const actions = document.createElement('div');
      actions.style.padding = '0 1rem 1rem';
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.style.height = '2rem';
      btn.style.width = '100%';
      btn.innerText = 'Publish Publicly';
      btn.onclick = (e) => {
        e.stopPropagation();
        publishVideo(video);
      };
      actions.appendChild(btn);
      card.appendChild(actions);
      return card;
    };

    // Navigation
    document.getElementById('sidebarToggle').addEventListener('click', () => document.getElementById('sidebar').classList.toggle('collapsed'));
    document.querySelector('[data-view="library"]').onclick = () => {
      libraryView.hidden = false; publicView.hidden = true;
      document.querySelector('[data-view="library"]').classList.add('active');
      document.querySelector('[data-view="public"]').classList.remove('active');
    };
    document.querySelector('[data-view="public"]').onclick = () => {
      libraryView.hidden = true; publicView.hidden = false;
      document.querySelector('[data-view="public"]').classList.add('active');
      document.querySelector('[data-view="library"]').classList.remove('active');
      loadPublicVideos();
    };

    // INIT
    if (!window.YT) {
      const tag = document.createElement('script');
      tag.src = "https://www.youtube.com/iframe_api";
      const firstScriptTag = document.getElementsByTagName('script')[0];
      firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    }

    renderLocalVideos();
  </script>
</body>
</html>
