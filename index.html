<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MyTube - Library</title>
  
  <!-- Link to the external CSS file -->
  <link rel="stylesheet" href="./css/style.css">
</head>
<body>

  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sidebar-header">
      <span class="yt-logo">▶</span> MyTube
    </div>
    <div class="nav-item active" id="navMyVideos" data-tab="my-videos">
      📁 My Videos
    </div>
    <div class="nav-item" id="navPublicVideos" data-tab="public-videos">
      🌐 Public Videos
    </div>
  </div>

  <!-- MAIN CONTENT -->
  <div class="main-content">
    
    <!-- MY VIDEOS SECTION -->
    <div id="myVideosSection">
      <div class="section-title">Add a new video to your library</div>
      
      <div class="add-video-box">
        <input type="url" id="urlInput" class="url-input" placeholder="Paste a YouTube link to save..." spellcheck="false" />
        <button id="addBtn" class="add-btn">Save Video</button>
      </div>

      <!-- Player Area -->
      <div class="player-container" id="playerContainer">
        <div id="defaultMsg" class="error-message">Select a video below or add a new one to start watching.</div>
        <!-- The YouTube API will inject the iframe here -->
        <div id="youtubeContainer" hidden></div>
      </div>

      <!-- Video Grid -->
      <div class="section-title">Your Library</div>
      <div class="video-grid" id="myVideoGrid"></div>
    </div>

    <!-- PUBLIC VIDEOS SECTION (Placeholder) -->
    <div id="publicVideosSection" hidden>
      <div class="section-title">Public Videos</div>
      <div class="empty-state">We will build the public videos section later!</div>
    </div>

  </div>

  <!-- Load the App logic as a Module -->
  <script type="module" src="./js/app.js"></script>
</body>
</html>
